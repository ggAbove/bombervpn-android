name: Bomber VPN checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370'
      - name: Prepare pinned native libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/
          core_tag=$(git -C AndroidLibXrayLite describe --tags --exact-match)
          gh release download "$core_tag" --repo 2dust/AndroidLibXrayLite --pattern libv2ray.aar --dir V2rayNG/app/libs
      - name: Test, lint, and assemble both distributions
        working-directory: V2rayNG
        run: ./gradlew :app:testPlaystoreDebugUnitTest :app:testFdroidDebugUnitTest :app:lintPlaystoreDebug :app:lintFdroidDebug :app:assemblePlaystoreDebug :app:assembleFdroidDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: BomberVPN-debug-apks
          path: V2rayNG/app/build/outputs/apk/*/debug/*.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Android-check-reports
          path: V2rayNG/app/build/reports/
